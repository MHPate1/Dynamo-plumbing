    fill="#F5C135"
    fill-rule="evenodd"
    d="M11,13 L23,13 C41,13 53,21 53,32 C53,43 41,51 23,51 L11,51 Z
       M20,21 L23,21 C36,21 45,26 45,32 C45,38 36,43 23,43 L20,43 Z"
  />

  <!-- Flame above the D -->
  <path
    fill="#F5C135"
    d="M36,4 C37,8 41,10 39,15 C37,12 37,9 35,8 C35,11 33,14 33,17 C29,13 31,6 36,4 Z"
  />
</svg>
